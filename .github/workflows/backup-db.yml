name: Backup semanal do banco

# ponytail: o artefato fica no próprio GitHub, cifrado e por 90 dias (~12 cópias
# semanais). Quando o Supabase virar Pro (backup diário próprio), este workflow
# pode sair. O repositório é público: o segredo só entra por env, nunca em ${{ }}
# dentro de um comando, e nada aqui o imprime.

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conferir segredos
        shell: bash
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "$DB_URL" ] || { echo "::error::Secret SUPABASE_DB_URL vazio ou ausente"; exit 1; }
          [ -n "$PASS" ] || { echo "::error::Secret BACKUP_PASSPHRASE vazio ou ausente"; exit 1; }

      - name: Dump cifrado
        shell: bash
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          err="$(mktemp)"
          # o stderr do pg_dump pode trazer host e usuário: nunca vai ao log público
          if ! {
            docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump "$DB_URL" -Fc --no-owner' \
              | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                  --passphrase-fd 3 --output "backup-$(date +%F).dump.gpg" \
                  3< <(printf %s "$PASS")
          } 2>"$err"; then
            echo "::error::pg_dump falhou (veja a conexão/segredo SUPABASE_DB_URL)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: backup-db
          path: backup-*.dump.gpg
          retention-days: 90
          if-no-files-found: error
